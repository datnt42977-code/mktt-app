<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7d33">
<title>MKTT App</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MKTT App">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(120% 60% at 100% 0%, #12a049 0%, rgba(18,160,73,0) 55%),
      linear-gradient(165deg, #0a7d33 0%, #0c8a39 34%, #eef2ee 34%, #f5f7f5 100%);
    background-attachment: fixed;
    color: #142;
    padding: calc(26px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .app-head { display: flex; align-items: center; gap: 13px; color: #fff; margin: 4px 4px 2px; }
  .app-head img {
    width: 56px; height: 56px; background: #fff; border-radius: 15px; padding: 6px;
    box-shadow: 0 8px 20px rgba(0,0,0,.18);
  }
  .app-head .t1 { font-size: 23px; font-weight: 800; letter-spacing: .3px; }
  .app-head .t2 { font-size: 12.5px; opacity: .92; margin-top: 2px; }
  .company { color: #eafff0; font-size: 11.5px; letter-spacing: .2px; margin: 8px 6px 22px; opacity: .95; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 560px; margin: 0 auto; }
  .card {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 10px;
    background: #fff; border-radius: 20px; padding: 18px 16px;
    text-decoration: none; color: inherit;
    box-shadow: 0 10px 24px rgba(10,125,51,.12);
    border: 1px solid #eaf1ea; min-height: 138px;
    transition: transform .12s cubic-bezier(.2,.8,.2,1), box-shadow .12s ease;
  }
  .card:active { transform: translateY(2px) scale(.975); box-shadow: 0 5px 14px rgba(10,125,51,.14); }
  .card .ico {
    width: 50px; height: 50px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; line-height: 1;
    background: linear-gradient(145deg, #e8f7ed, #d3f0dc);
  }
  .card.c2 .ico { background: linear-gradient(145deg, #fff3d9, #ffe6b0); }
  .card .name { font-size: 16px; font-weight: 750; letter-spacing: .2px; }
  .card .desc { font-size: 11.5px; color: #6a7d72; line-height: 1.35; margin-top: auto; }
  .card .go { position: absolute; top: 16px; right: 16px; color: #b6cbbd; font-size: 18px; font-weight: 700; }
  .card.soon { background: #eef3ef; color: #9ab0a2; box-shadow: none; pointer-events: none; border-color: #e2ebe3; }
  .card.soon .ico { background: #e2ebe3; filter: grayscale(.4); opacity: .7; }
  .card.soon .badge { align-self: flex-start; font-size: 10px; font-weight: 700; background: #d6e2d8; color: #5c7565; padding: 3px 9px; border-radius: 999px; margin-top: auto; }
  .foot { text-align: center; color: #7d908a; font-size: 11.5px; margin-top: 24px; }
  .refresh-btn {
    margin-left: auto; border: 0; background: rgba(255,255,255,.18); color: #fff;
    width: 40px; height: 40px; border-radius: 12px; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); transition: transform .3s ease, background .15s;
  }
  .refresh-btn:active { background: rgba(255,255,255,.32); }
  .refresh-btn.spin { transform: rotate(360deg); }
</style>
</head>
<body>
  <div class="app-head">
    <img src="assets/logo.png" alt="MKTT">
    <div>
      <div class="t1">MKTT App</div>
      <div class="t2">Bộ công cụ Mê Kông Thương Tín</div>
    </div>
    <button id="btn-refresh" class="refresh-btn" title="Cập nhật app" aria-label="Cập nhật app">↻</button>
  </div>
  <div class="company">CÔNG TY TNHH BÊ TÔNG MÊ KÔNG THƯƠNG TÍN</div>

  <div class="grid">
    <a class="card c1" href="baogia/index.html">
      <div class="ico">🧾</div>
      <span class="go">›</span>
      <div class="name">Báo Giá</div>
      <div class="desc">Tạo báo giá bê tông, in / lưu PDF</div>
    </a>
    <a class="card c2" href="dntt/index.html">
      <div class="ico">💰</div>
      <span class="go">›</span>
      <div class="name">Đề Nghị Thanh Toán</div>
      <div class="desc">Thư đề nghị thanh toán công nợ</div>
    </a>
    <div class="card soon">
      <div class="ico">📦</div>
      <div class="name">Đơn Hàng</div>
      <span class="badge">Sắp có</span>
    </div>
    <div class="card soon">
      <div class="ico">➕</div>
      <div class="name">Thêm chức năng</div>
      <span class="badge">Sắp có</span>
    </div>
  </div>

  <div class="foot">Chạm để mở · Dùng được offline</div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    document.getElementById('btn-refresh').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.classList.add('spin'); btn.disabled = true;
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (_) {}
      setTimeout(() => location.reload(), 350);
    });
  </script>
</body>
</html>
