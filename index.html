<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7d33">
<title>MKTT App</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MKTT App">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0a7d33 0%, #0d8f3b 40%, #f4f6f4 40%, #f4f6f4 100%);
    background-attachment: fixed;
    color: #142; 
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .app-head { display: flex; align-items: center; gap: 12px; color: #fff; margin: 6px 4px 4px; }
  .app-head img { width: 52px; height: 52px; background: #fff; border-radius: 12px; padding: 5px; }
  .app-head .t1 { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
  .app-head .t2 { font-size: 12.5px; opacity: .9; }
  .company { color: #eafff0; font-size: 12px; margin: 2px 6px 20px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 560px; margin: 0 auto; }
  .card {
    display: flex; flex-direction: column; gap: 8px;
    background: #fff; border-radius: 16px; padding: 18px 16px;
    text-decoration: none; color: inherit;
    box-shadow: 0 6px 18px rgba(10,125,51,.10);
    border: 1px solid #e7efe8; min-height: 128px;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .card:active { transform: scale(.97); }
  .card .ico { font-size: 34px; line-height: 1; }
  .card .name { font-size: 16px; font-weight: 700; }
  .card .desc { font-size: 12px; color: #678; margin-top: auto; }
  .card.soon { background: #eef3ef; color: #8aa; box-shadow: none; pointer-events: none; }
  .card.soon .badge { align-self: flex-start; font-size: 10px; background: #d6e2d8; color: #567; padding: 2px 8px; border-radius: 999px; }
  .foot { text-align: center; color: #789; font-size: 11.5px; margin-top: 22px; }
</style>
</head>
<body>
  <div class="app-head">
    <img src="assets/logo.png" alt="MKTT">
    <div>
      <div class="t1">MKTT App</div>
      <div class="t2">Bộ công cụ Mê Kông Thương Tín</div>
    </div>
  </div>
  <div class="company">CÔNG TY TNHH BÊ TÔNG MÊ KÔNG THƯƠNG TÍN</div>

  <div class="grid">
    <a class="card" href="baogia/index.html">
      <div class="ico">🧾</div>
      <div class="name">Báo Giá</div>
      <div class="desc">Tạo báo giá bê tông, in / lưu PDF</div>
    </a>
    <a class="card" href="dntt/index.html">
      <div class="ico">💰</div>
      <div class="name">Đề Nghị Thanh Toán</div>
      <div class="desc">Thư đề nghị thanh toán công nợ</div>
    </a>
    <div class="card soon">
      <div class="ico">📦</div>
      <div class="name">Đơn Hàng</div>
      <span class="badge">Sắp có</span>
    </div>
    <div class="card soon">
      <div class="ico">➕</div>
      <div class="name">Thêm chức năng</div>
      <span class="badge">Sắp có</span>
    </div>
  </div>

  <div class="foot">Chạm để mở · Dùng được offline</div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
